[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcal"
version = "0.1.0"
description = "MCal: missingness bias calibration for feature attribution explanations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shailesh Sridhar" },
    { name = "Anton Xue" },
    { name = "Eric Wong" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.60",
    "matplotlib>=3.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# OpenAI wrapper used by the LIME demo behind Figures 9 and 10
openai = ["openai>=1.0"]
# Everything the benchmark scripts and figure notebooks import
experiments = [
    "openai>=1.0",
    "timm>=0.9",
    "transformers>=4.40",
    "datasets>=2.18",
    "peft>=0.10",
    "trl>=0.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pandas>=2.0",
    "seaborn>=0.12",
    "shap>=0.44",
    "xgboost>=2.0",
    "tabulate>=0.9",
    "pillow>=9.0",
]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ShaileshSridhar2403/MCal"
Paper = "https://arxiv.org/abs/2603.04831"

[tool.setuptools.packages.find]
include = ["mcal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
